name: Sonar

on:
  push:
  # Run automatically every Monday on midnight.
  schedule:
    - cron: '0 0 * * 1'
  workflow_call:
  # Allow manually triggering the workflow.
  workflow_dispatch:

jobs:
  unit:
    name: Unit Tests on ${{ matrix.php }}
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 5
      matrix:
        os: [ubuntu-latest]
        php: ['8.1']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, gd, soap
          tools: composer, pecl, phpcs, phpstan, phpunit:9.5
          ini-values: pcov.directory=api, post_max_size=256M, short_open_tag=On #optional, setup php.ini configuration
          coverage: pcov #optional, setup coverage driver
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --dev -n --prefer-dist --ignore-platform-req=php+

      - name: Run Unit Tests
        run: vendor/bin/phpunit --configuration ./phpunit.xml.dist --testsuite=Unit  -vvv --debug;

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./dev/tests/clover.xml
          full_report: ./dev/tests/clover.xml
          flags: unittests
          verbose: true

      - name: prepare SonarCloud Scan Data
        continue-on-error: true
        if: ${{ matrix.php == '8.1' }}
        run: |
          echo $PWD
          ls -la ./
          ls -la ./dev/tests/
          sed -i 's@'$GITHUB_WORKSPACE'/@/github/workspace/@g' ./dev/tests/junit.xml
          sed -i 's@'$GITHUB_WORKSPACE'/@/github/workspace/@g' ./dev/tests/clover.xml
          head -n 30 ./dev/tests/clover.xml
          echo "####"
          tail -n 30 ./dev/tests/clover.xml

